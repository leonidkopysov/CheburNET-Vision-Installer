name: Служебная сборка установщика

on:
  push:
    branches: [codex/installer-ux-report-20260910]

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка Python-тестов
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Воспроизводимая сборка
        run: python3 build.py
      - name: Проверка Bash и SHA-256
        run: |
          bash -n src/installer.sh
          bash -n cheburnet-vision-install.sh
          sha256sum -c SHA256SUMS
      - name: Установка ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Проверка ShellCheck
        run: |
          shellcheck -S style src/installer.sh cheburnet-vision-install.sh
          shellcheck -S style src/acme-firewall.sh src/acme-pre.sh src/acme-post.sh
          shellcheck -S style src/hardening.sh src/renew-hook.sh src/check-nofile.sh
      - name: Сохранение собранных файлов
        run: |
          if git diff --quiet -- cheburnet-vision-install.sh SHA256SUMS; then
            echo "Сборка уже актуальна"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cheburnet-vision-install.sh SHA256SUMS
          git commit -m "Собрать установщик после проверки"
          git push origin HEAD
