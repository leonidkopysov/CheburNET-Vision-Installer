name: Служебная сборка установщика

on:
  push:
    branches: [codex/build-report-columns-20260910]

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка Python-тестов
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Обновление снимка и воспроизводимая сборка
        shell: bash
        run: |
          traffic_sha=$(sha256sum src/cheburnet-traffic-control.py | awk '{print $1}')
          python3 - "$traffic_sha" <<'PY'
          import re
          import sys
          from pathlib import Path
          path = Path("build.py")
          source = path.read_text(encoding="utf-8")
          source, count = re.subn(
              r"TRAFFIC_CONTROL_SHA256 = '[0-9a-f]{64}'",
              f"TRAFFIC_CONTROL_SHA256 = '{sys.argv[1]}'",
              source,
          )
          if count != 1:
              raise SystemExit("Не найдена контрольная сумма Traffic Control")
          path.write_text(source, encoding="utf-8")
          PY
          python3 build.py
      - name: Проверка Bash и SHA-256
        run: |
          bash -n src/installer.sh
          bash -n cheburnet-vision-install.sh
          sha256sum -c SHA256SUMS
      - name: Установка ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Проверка ShellCheck
        run: |
          shellcheck -S style src/installer.sh cheburnet-vision-install.sh
          shellcheck -S style src/acme-firewall.sh src/acme-pre.sh src/acme-post.sh
          shellcheck -S style src/hardening.sh src/renew-hook.sh src/check-nofile.sh
      - name: Сохранение собранных файлов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.py cheburnet-vision-install.sh SHA256SUMS
          git diff --cached --quiet && exit 0
          git commit -m "Собрать установщик после проверки"
          git push origin HEAD
